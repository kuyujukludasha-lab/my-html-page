<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SupplyFlow 360</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#12162b;--mu:#6b7191;--bd:#e6e8f1;--ac:#4f46e5;--ok:#10a37f;--wn:#e9a100;--er:#e5484d;--sb:#12162b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--card:#171b30;--tx:#eef0fa;--mu:#9097b8;--bd:#272c47;--sb:#090b17}}
:root[data-theme=dark]{--bg:#0d1020;--card:#171b30;--tx:#eef0fa;--mu:#9097b8;--bd:#272c47;--sb:#090b17}
*{box-sizing:border-box}html{height:100%}body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:flex}
aside{width:220px;background:var(--sb);color:#c9cde6;padding:20px 12px;flex:none;display:flex;flex-direction:column;gap:4px}
.logo{color:#fff;font-weight:700;font-size:17px;padding:4px 10px 18px}.logo b{color:#8b85ff}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;display:block}aside button:hover{background:#ffffff14}aside button.on{background:var(--ac);color:#fff}
.demo{margin-top:auto;font-size:11px;color:#8d93b5;padding:10px}
main{flex:1;overflow:auto;padding:28px 36px;max-width:100%}
h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin-bottom:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}.k5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.kpi small{color:var(--mu)}.kpi div{font-size:26px;font-weight:700;margin-top:2px}.kpi em{font-style:normal;font-size:12px}
.btn{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;background:var(--ac);color:#fff}.btn.red{background:var(--er)}.btn.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#10a37f22;color:var(--ok)}.wn{background:#e9a10026;color:var(--wn)}.er{background:#e5484d22;color:var(--er)}.in{background:#4f46e522;color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}.row:last-child{border:0}
.row.cl{cursor:pointer}.row.cl:hover{background:var(--bg)}
.alert{border-color:var(--er);background:#e5484d0d;margin-bottom:16px}
.sc{cursor:pointer;border:2px solid var(--bd);border-radius:14px;padding:14px;background:var(--card)}.sc.on{border-color:var(--ac);box-shadow:0 0 0 3px #4f46e533}.sc:hover{border-color:var(--ac)}
.sc dl{margin:8px 0 0;display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}.sc dt{color:var(--mu)}.sc dd{margin:0;font-weight:600;text-align:right}
.node{cursor:pointer}.node rect{fill:var(--card);stroke:var(--bd);stroke-width:1.5}.node:hover rect{stroke:var(--ac)}.node text{fill:var(--tx);font-size:13px;font-weight:600}.node .s{font-size:11px;font-weight:400;fill:var(--mu)}
.step{display:flex;gap:14px;padding:12px 0}.dot{width:14px;height:14px;border-radius:50%;margin-top:4px;flex:none}.line{border-left:2px solid var(--bd);margin-left:6px}
.scroll{overflow-x:auto}.ba{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:8px}.logo,.demo{display:none}main{padding:18px}.ba{grid-template-columns:1fr}}
body{font-feature-settings:"tnum";-webkit-font-smoothing:antialiased}
.card{box-shadow:0 1px 2px #12162b0a,0 10px 28px -14px #12162b1f}h1{letter-spacing:-.02em}
aside button{display:flex;gap:10px;align-items:center;font-weight:500}aside button i{width:8px;height:8px;border-radius:3px;background:currentColor;opacity:.45}aside button.on i{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.chip{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--tx);display:inline-flex;gap:7px;align-items:center}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
select{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px}
.phone{width:300px;max-width:100%;margin:0 auto;border:8px solid #12162b;border-radius:36px;background:var(--card);padding:16px;min-height:560px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:4px;margin-top:auto}.tabs button{flex:1;font-size:11px;padding:8px 2px;border:0;border-radius:8px;background:var(--bg);color:var(--mu);cursor:pointer}.tabs button.on{background:var(--ac);color:#fff}
.t{color:var(--mu);min-width:44px;font-size:13px}.lt{display:inline-block;width:9px;height:9px;border-radius:50%}
</style></head><body>
<aside><div class="logo">Supply<b>Flow</b> 360</div><div id="nav" style="display:contents"></div><div class="demo">Demo data · все данные демонстрационные</div></aside>
<main id="m"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const PAGES=['Dashboard','Заказы','Транспорт','Склады','Control Tower','Аналитика','Водитель'];
const S={page:0,reg:'Все',role:0,sup:'',wi:null,ph:0,q:0,scan:0,photo:0,off:0,sig:{},clk:621,log:[['10:02','Рейс TR-1057 погружен на складе Казань'],['10:09','РЦ Москва: приёмка 12 пал. завершена'],['10:15','Склад №1 Тула: загрузка достигла 94%'],['10:21','Рейс TR-1041 прошёл КПП, ETA 14:20']],inc:false,sc:null,order:0,done:{},node:null};
const SC={A:{n:'Ничего не менять',cost:0,risk:78,eff:-12.8,otif:87.6,t:'Задержка дойдёт до магазинов, штрафы SLA и потери продаж.'},
B:{n:'Изменить маршрут (экспресс-доставка с другого поставщика)',cost:2.1,risk:34,eff:7.5,otif:93.4,t:'Запасной поставщик + экспресс-транспорт, ETA −11 ч.'},
C:{n:'Перераспределить запас между складами',cost:1.2,risk:21,eff:9.2,otif:93.9,t:'Запас Склада №2 (Казань) направлен в РЦ Москва и СПб.'}};
const base={orders:12480,otif:94.2,ship:318,risks:3,cost:18.4};
function kp(){let k={...base};if(S.inc){k.otif=91.1;k.risks=4;k.cost=18.4}
if(S.sc){const c=SC[S.sc];k.otif=c.otif;k.cost=+(18.4+c.cost).toFixed(1);k.risks=S.sc=='A'?5:2;if(S.sc!='A')k.ship=318+(S.sc=='B'?24:0)}const f={'Все':1,'Москва':.52,'Санкт-Петербург':.28,'Казань':.2}[S.reg];k.orders=Math.round(k.orders*f);k.ship=Math.round(k.ship*f);k.cost=+(k.cost*f).toFixed(1);return k}
const ORD=[['SF-48211','Молоко Простор 3,2%, 12 пал.','Агро-Юг','Магазин Москва-14',0],['SF-48212','Бытовая химия, 8 пал.','ЧистоПром','Магазин СПб-07',1],['SF-48213','Напитки, 20 пал.','АкваВита','Магазин Казань-03',0],['SF-48214','Бакалея, 15 пал.','Агро-Юг','Магазин Москва-02',1],['SF-48215','Сыры, 6 пал.','Агро-Юг','Магазин Тверь-05',1],['SF-48216','Овощи, 10 пал.','ФермаПлюс','Магазин СПб-12',0],['SF-48217','Хлеб, 4 пал.','Хлебозавод №3','Магазин Москва-21',0],['SF-48218','Кондитерка, 9 пал.','СладкоПром','Магазин Н.Новгород-04',0]];
const ST=['Поставщик','Склад','Транспорт','РЦ','Магазин','Клиент'];
function stages(o){const aff=o[4]&&S.inc;const res=S.sc&&S.sc!='A';
const dev=aff?(res?(S.sc=='B'?'+7 ч':'+2 ч'):(S.sc=='A'?'+18 ч':'+18 ч')):'0 ч';
const mk=(t,tm,d,s)=>({t,tm,d,s});
const w=aff&&!res?'er':aff?'wn':'ok';
return [mk(ST[0],'02 окт 06:10',aff?'+18 ч':'0 ч',aff?(res?'wn':'er'):'ok'),mk(ST[1],'02 окт 09:40',aff&&!res?'+18 ч':aff?dev:'0 ч',w),mk(ST[2],'02 окт 14:00',aff?dev:'+0,5 ч',aff?w:'ok'),mk(ST[3],'03 окт 05:30',aff?dev:'0 ч',aff?w:'in'),mk(ST[4],'03 окт 10:00',aff?dev:'0 ч',aff?w:'in'),mk(ST[5],'03 окт 18:00',aff?dev:'0 ч',aff?w:'in')].map((x,i)=>({...x,st:['Отгружено','Принято','В пути','Ожидается','Ожидается','Ожидается'][i]+(aff&&i<2&&!res?' (задержка)':'')}))}
const COL={ok:'var(--ok)',wn:'var(--wn)',er:'var(--er)',in:'#9aa0c0'};
const tag=(c,t)=>`<span class="tag ${c}">${t}</span>`;
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(toast.i);toast.i=setTimeout(()=>e.className='',2600)}
function addLog(t){S.clk+=3;const h=Math.floor(S.clk/60),m=S.clk%60;S.log.push([String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),t])}
function go(i){S.page=i;render()}
function sim(){S.inc=true;S.sc=null;addLog('Сбой: «Агро-Юг» задерживает поставку на 18 ч, под угрозой 426 заказов');go(0);toast('Обнаружен сбой: поставщик «Агро-Юг»')}
function pick(k){S.sc=k;addLog('Выбран сценарий '+k+': '+SC[k].n);render();toast('Выбран сценарий '+k+': цепочка перестроена')}
function reset(){addLog('Сценарий сброшен, цепочка в штатном режиме');S.inc=false;S.sc=null;S.done={};render()}
// charts
function line(d,lab,col,unit){const W=420,H=170,mx=Math.max(...d),mn=Math.min(...d),p=24;const x=i=>p+i*(W-2*p)/(d.length-1),y=v=>H-p-(v-mn)/(mx-mn||1)*(H-2*p);
return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="${col}" stroke-width="3" points="${d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${col}"><title>${lab[i]}: ${v}${unit}</title></circle><text x="${x(i)}" y="${H-5}" font-size="10" text-anchor="middle" fill="var(--mu)">${lab[i]}</text>`).join('')}</svg>`}
function bars(d,lab,col,unit){const W=420,H=170,mx=Math.max(...d.map(Math.abs)),p=24,bw=(W-2*p)/d.length;
return `<svg viewBox="0 0 ${W} ${H}" width="100%">${d.map((v,i)=>{const h=Math.abs(v)/mx*(H-60);return `<rect x="${p+i*bw+6}" y="${H-24-h}" width="${bw-12}" height="${h}" rx="5" fill="${col}"><title>${lab[i]}: ${v}${unit}</title></rect><text x="${p+i*bw+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mu)">${lab[i]}</text><text x="${p+i*bw+bw/2}" y="${H-28-h}" font-size="10" text-anchor="middle" fill="var(--tx)">${v}</text>`}).join('')}</svg>`}
const M=['Апр','Май','Июн','Июл','Авг','Сен'];
// chain
function chain(){const inc=S.inc,sc=S.sc;const N=[['Поставщик','Агро-Юг',inc?(sc&&sc!='A'?'wn':'er'):'ok'],['Склад','Склад №1 Тула','ok'],['Транспорт',kp().ship+' рейсов',sc=='B'?'ok':inc&&!sc?'wn':'ok'],['РЦ','РЦ Москва',inc&&!sc?'wn':inc&&sc=='A'?'er':'ok'],['Магазин','214 магазинов',inc&&!sc?'wn':inc&&sc=='A'?'er':'ok']];
let s=`<svg viewBox="0 0 900 230" width="100%" style="min-width:640px"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4 0 8z" fill="#9aa0c0"/></marker></defs>`;
N.forEach((n,i)=>{const x=10+i*180;if(i<4)s+=`<line x1="${x+140}" y1="70" x2="${x+178}" y2="70" stroke="${inc&&!sc&&i==0?'var(--er)':'#9aa0c0'}" stroke-width="2.5" ${inc&&!sc&&i==0?'stroke-dasharray="5 4"':''} marker-end="url(#a)"/>`;
s+=`<g class="node" onclick="S.node=${i};render()"><rect x="${x}" y="30" width="140" height="80" rx="14"/><circle cx="${x+122}" cy="48" r="6" fill="${COL[n[2]]}"/><text x="${x+14}" y="66">${n[0]}</text><text class="s" x="${x+14}" y="88">${n[1]}</text></g>`});
if(sc=='B')s+=`<path d="M100 110 C100 190 560 190 560 110" fill="none" stroke="var(--ok)" stroke-width="3" stroke-dasharray="6 4"/><text x="330" y="205" fill="var(--ok)" font-size="12" font-weight="600" text-anchor="middle">Запасной поставщик · экспресс-маршрут</text>`;
if(sc=='C')s+=`<g class="node"><rect x="370" y="150" width="170" height="50" rx="12" style="stroke:var(--ok)"/><text x="384" y="173">Склад №2 Казань</text><text class="s" x="384" y="190">запас → РЦ</text></g><path d="M455 150 L590 112" stroke="var(--ok)" stroke-width="3" fill="none" marker-end="url(#a)"/>`;
if(sc=='A')s+=`<text x="450" y="160" text-anchor="middle" fill="var(--er)" font-size="13" font-weight="600">Без изменений: риск каскадного срыва поставок</text>`;
return s+'</svg>'}
const NODEINFO=['Поставщик «Агро-Юг»: 2 840 заказов в неделю, надёжность 96%.','Склад №1 Тула: загрузка 82%, 4 200 паллет.','Транспорт: 318 активных перевозок, средняя задержка 0,4 ч.','РЦ Москва: загрузка 76%, SLA выполнен на 97%.','Магазины: 214 точек, доступность товара 96,8%.'];
function events(){const e=[];if(S.inc)e.push(['er','Задержка поставщика «Агро-Юг» +18 ч','Под угрозой 426 заказов']);
e.push(['wn','Перегрузка Склада №1 Тула','Загрузка 94% · прогноз пик 04 окт']);e.push(['wn','Риск дефицита: молочная группа','Покрытие 1,8 дня в РЦ СПб']);e.push(['wn','Задержка транспорта на трассе М4','+2,5 ч · 11 рейсов']);return e}
function incPanel(){if(!S.inc)return '';const c=S.sc?SC[S.sc]:null;
return `<div class="card alert"><div class="top"><div><h2 style="color:var(--er)">Сбой: поставщик «Агро-Юг» задерживает поставку на 18 часов</h2>
<div><b>Причина:</b> остановка линии фасовки на заводе (аварийный простой). <b>Затронуто заказов:</b> 426 из 12 480 · <b>Потенциальный ущерб:</b> 12,8 млн ₽</div></div><button class="btn gh" onclick="reset()">Сбросить</button></div>
<div class="grid g2" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${Object.entries(SC).map(([k,v])=>`<div class="sc ${S.sc==k?'on':''}" onclick="pick('${k}')"><b>${k} — ${v.n}</b><dl><dt>Доп. затраты</dt><dd>${v.cost} млн ₽</dd><dt>Ожидаемый риск</dt><dd>${v.risk}%</dd><dt>Фин. эффект</dt><dd style="color:${v.eff<0?'var(--er)':'var(--ok)'}">${v.eff>0?'+':''}${v.eff} млн ₽</dd></dl></div>`).join('')}</div>
${c?`<div style="margin-top:14px"><b>Результат сценария ${S.sc}:</b> ${c.t} OTIF прогноз ${c.otif}%, чистый эффект ${c.eff>0?'+':''}${c.eff} млн ₽.</div>`:'<div style="margin-top:12px;color:var(--mu)">Выберите сценарий реагирования.</div>'}</div>`}
const P=[()=>{const k=kp();const kc=(a,b,c,x='')=>`<div class="card kpi"><small>${a}</small><div>${b}</div><em style="color:${x||'var(--mu)'}">${c}</em></div>`;
return `<div class="top"><div><h1>Dashboard</h1><div class="sub">Сквозная видимость цепочки поставок · demo data</div></div><button class="btn red" onclick="sim()">Симулировать сбой</button></div>${incPanel()}${filters()}
<div class="grid k5">${kc('Заказов',k.orders.toLocaleString('ru'),'за неделю')}${kc('OTIF',k.otif+'%',S.inc?'▼ ниже цели 95%':'цель 95%',S.inc&&k.otif<92?'var(--er)':'')}${kc('Активных перевозок',k.ship,'в пути')}${kc('Рисков',k.risks,S.inc?'есть критичные':'под контролем',S.inc&&S.sc!='B'&&S.sc!='C'?'var(--er)':'')}${kc('Стоимость логистики',k.cost+' млн ₽','за неделю')}</div>
<div class="card" style="margin-top:16px"><h2>Цепочка поставок <small style="color:var(--mu);font-weight:400">· нажмите на узел</small></h2><div class="scroll">${chain()}</div>${S.node!=null?drill(S.node):''}</div>
${roleCard()}${feedCard()}<div class="card" style="margin-top:16px"><h2>Критические события</h2>${events().map(e=>`<div class="row cl" onclick="go(4)"><span>${tag(e[0],e[0]=='er'?'Критично':'Внимание')} &nbsp;${e[1]}</span><span style="color:var(--mu)">${e[2]}</span></div>`).join('')}</div>`},
()=>{const o=ORD[S.order],st=stages(o);return `<h1>Заказы</h1><div class="sub">Нажмите на заказ, чтобы увидеть сквозной маршрут · demo data</div><div class="grid g2"><div class="card">${filt()}${ORD.map((x,i)=>{if(S.sup&&x[2]!=S.sup)return '';const a=x[4]&&S.inc;return `<div class="row cl" style="${i==S.order?'background:var(--bg)':''}" onclick="S.order=${i};render()"><div><b>${x[0]}</b><br><small style="color:var(--mu)">${x[1]} · ${x[2]} → ${x[3]}</small></div>${a?(S.sc&&S.sc!='A'?tag('wn','Под контролем'):tag('er','Задержка')):tag('ok','По плану')}</div>`}).join('')}</div>
<div class="card"><h2>Маршрут ${o[0]}</h2><div class="line">${st.map(s=>`<div class="step"><span class="dot" style="background:${COL[s.s]};margin-left:-8px"></span><div style="flex:1"><b>${s.t}</b> <span style="color:var(--mu)">· ${s.st}</span><br><small>${s.tm} · отклонение: <b style="color:${s.d.startsWith('+')&&s.d!='+0,5 ч'?COL[s.s]:'inherit'}">${s.d}</b></small></div></div>`).join('')}</div></div></div>`},
()=>{const rows=[['TR-1041','Тула → РЦ Москва','В пути',0],['TR-1042','Тула → РЦ Москва','В пути',0],['TR-1057','Казань → РЦ СПб','Погрузка',0],['TR-1063','Агро-Юг → Тула','Ожидает поставщика',1],['TR-1071','РЦ Москва → Магазины','В пути',0]];
return `<h1>Транспорт</h1><div class="sub">${kp().ship} активных перевозок · demo data</div><div class="card">${rows.map(r=>{const a=r[3]&&S.inc;return `<div class="row"><span><b>${r[0]}</b> · ${r[1]}</span><span>${r[2]} ${a?(S.sc=='B'?tag('ok','Экспресс-маршрут'):tag('er','+18 ч')):tag('ok','Вовремя')}</span></div>`}).join('')}</div>`},
()=>{const W=[['Склад №1 Тула',94,'Перегрузка'],['Склад №2 Казань',S.sc=='C'?58:71,S.sc=='C'?'Запас передан в РЦ':'Резерв доступен'],['РЦ Москва',76,'Норма'],['РЦ Санкт-Петербург',68,'Покрытие молока 1,8 дня']];
return `<h1>Склады</h1><div class="sub">Загрузка и запасы · demo data</div><div class="card">${W.map(w=>`<div class="row"><div style="flex:1"><b>${w[0]}</b> <small style="color:var(--mu)">${w[2]}</small><div style="height:8px;background:var(--bd);border-radius:9px;margin-top:6px"><div style="width:${w[1]}%;height:8px;border-radius:9px;background:${w[1]>90?'var(--er)':'var(--ac)'}"></div></div></div><b>${w[1]}%</b></div>`).join('')}</div>`},

()=>{const ch=(t,s)=>`<div class="card"><h2>${t}</h2>${s}</div>`;

return `<h1>Аналитика</h1><div class="sub">Динамика за 6 месяцев · demo data (наведите на точки)</div><div class="grid g2">
${ch('OTIF, %',line([88.1,89.9,91.3,92.6,93.8,94.2],M,'var(--ac)','%'))}${ch('Стоимость логистики, млн ₽ / нед.',line([21.2,20.6,20.1,19.4,18.9,18.4],M,'var(--ok)',' млн'))}
${ch('Количество задержек',bars([312,276,241,198,162,131],M,'var(--wn)',''))}${ch('Время реакции на инцидент, мин',line([240,180,95,48,22,9],M,'var(--er)',' мин'))}
${ch('Экономический эффект решений, млн ₽',bars([1.2,2.4,3.9,5.1,6.8,8.3],M,'var(--ok)',' млн'))}</div>

<div class="ba">${ba('До',['Excel и почта','ERP поставщиков','WMS склада','TMS перевозчиков','Звонки и мессенджеры'].map(x=>`<div class="row">${x}${tag('er','изолировано')}</div>`).join('')+'<p style="color:var(--mu)">Реакция на сбой: ~4 ч. Нет сквозной картины.</p>','var(--er)')}
${ba('После',`<div class="row">Единое окно: поставщики, склады, транспорт, РЦ, магазины ${tag('ok','1 система')}</div><div class="row">Control Tower ${tag('ok','авто')}</div><div class="row">Сценарии «что если» ${tag('ok','онлайн')}</div><p style="color:var(--ok)">Реакция на сбой: 9 мин · OTIF +6,1 п.п. · логистика −13%.</p>`,'var(--ok)')}</div>`}];
const REG=['Все','Москва','Санкт-Петербург','Казань'];

const WI=[['Закрыть Склад №1 Тула на 24 ч','1 180 заказов под риском · +2,6 млн ₽ · OTIF −2,4 п.п.','Перенаправить поставки на Склад №2 Казань'],['Сменить маршрут Тула → Москва на М11','+1,1 ч в пути · −0,4 млн ₽ · OTIF +0,3 п.п.','Выгодно при загрузке трассы М4 выше 80%'],['Увеличить страховой запас молочной группы на 15%','+0,9 млн ₽ · риск дефицита −40%','Рекомендуется для РЦ Санкт-Петербург']];

if(S.ph==1)b=['ТТН № 48211-7','CMR № 0612-26'].map((d,i)=>`${c}<b>${d}</b><br><small style="color:var(--mu)">Тула → РЦ Москва</small><div style="margin-top:8px">${S.sig[i]?'<span class="tag ok">Подписано · 10:27</span>':`<button class="btn" onclick="S.sig[${i}]=1;addLog('${d} подписан водителем');render()">Подписать</button>`}</div></div>`).join('');

return `<h1>Модуль водителя</h1><div class="sub">Мобильное приложение для рейса · demo data</div><div class="grid g2"><div class="phone">${S.off?'<span class="tag wn">Офлайн · синхронизация при подключении</span>':'<span class="tag ok">Онлайн</span>'}${b}<div class="tabs">${T.map((t,i)=>`<button class="${i==S.ph?'on':''}" onclick="S.ph=${i};render()">${t}</button>`).join('')}</div></div>
